      /* ══ skill-loom · design system (Studio · teal 205 · cool neutrals) ══════
   Light + dark, WCAG-AA verified. This is the stylesheet the real
   src/ui.html will adopt. */

      /* toggle switch (activate / deactivate a runtime) — defined early, reused */
      .switch {
        position: relative;
        width: 34px;
        height: 20px;
        border-radius: 999px;
        background: var(--line);
        cursor: pointer;
        transition: background 0.15s;
        flex: 0 0 auto;
        border: 0;
        padding: 0;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: var(--shadow-sm);
        transition: transform 0.15s;
      }
      .switch.on {
        background: var(--accent);
      }
      .switch.on::after {
        transform: translateX(14px);
      }
      .switch:disabled {
        cursor: default;
        opacity: 0.55;
      }

      /* status page: section headers + save action bar */
      .sec {
        margin: 26px 0 12px;
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .sec h2 {
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.01em;
        margin: 0;
      }
      .sec .cnt {
        font-size: 12.5px;
        color: var(--faint);
      }
      .saverow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 14px 0 4px;
        flex-wrap: wrap;
      }
      .saverow .note {
        font-size: 13px;
        color: var(--dim);
      }

      /* expandable per-file change (native <details>) */
      .chg {
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 10px;
        background: var(--surface);
        max-width: 92ch;
      }
      .chg > summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
      }
      .chg > summary::-webkit-details-marker {
        display: none;
      }
      .chg .skname {
        font-weight: 600;
        font-size: 14px;
      }
      .chg .path {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--faint);
      }
      .chg .chev {
        margin-left: auto;
        color: var(--faint);
        transition: transform 0.15s;
      }
      .chg[open] .chev {
        transform: rotate(90deg);
      }
      .chg .body {
        padding: 0 16px 14px;
      }
      .chg[open] > summary {
        border-bottom: 1px solid var(--hair);
        margin-bottom: 12px;
      }

      :root {
        --bg: oklch(97.6% 0.006 232);
        --surface: oklch(99.3% 0.003 232);
        --panel: oklch(95% 0.008 232);
        --line: oklch(90.5% 0.011 232);
        --hair: oklch(93.5% 0.009 232);
        --fg: oklch(26% 0.018 245);
        --prose: oklch(33% 0.018 245);
        --prose-b: oklch(24% 0.018 245);
        --dim: oklch(50% 0.02 242);
        --faint: oklch(57.5% 0.017 240);
        --accent: oklch(48.5% 0.115 205);
        --accent-soft: oklch(48.5% 0.115 205 / 0.13);
        --ok: oklch(46% 0.13 160);
        --ok-soft: oklch(46% 0.13 160 / 0.15);
        --warn: oklch(51.5% 0.115 68);
        --warn-soft: oklch(51.5% 0.115 68 / 0.16);
        --err: oklch(52% 0.16 25);
        --err-soft: oklch(52% 0.16 25 / 0.12);
        --shadow-sm: 0 1px 2px oklch(40% 0.03 245 / 0.07);

          0 1px 2px oklch(40% 0.03 245 / 0.06),
          0 10px 30px oklch(40% 0.03 245 / 0.09);
        --font: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --btn-fg: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: oklch(21% 0.012 245);
          --surface: oklch(24.5% 0.014 245);
          --panel: oklch(28.5% 0.016 245);
          --line: oklch(34% 0.016 245);
          --hair: oklch(30% 0.014 245);
          --fg: oklch(92% 0.01 240);
          --prose: oklch(81% 0.012 240);
          --prose-b: oklch(86.5% 0.011 240);
          --dim: oklch(70% 0.014 240);
          --faint: oklch(58% 0.014 240);
          --accent: oklch(78% 0.1 205);
          --accent-soft: oklch(78% 0.1 205 / 0.17);
          --ok: oklch(72% 0.13 160);
          --ok-soft: oklch(72% 0.13 160 / 0.16);
          --warn: oklch(76% 0.13 74);
          --warn-soft: oklch(76% 0.13 74 / 0.17);
          --err: oklch(68% 0.15 25);
          --err-soft: oklch(68% 0.15 25 / 0.16);
          --shadow-sm: 0 1px 2px oklch(0% 0 0 / 0.4);
          --shadow:
            0 1px 2px oklch(0% 0 0 / 0.4), 0 10px 30px oklch(0% 0 0 / 0.35);
          --btn-fg: oklch(20% 0.02 245);
        }
      }

      /* Taxonomy accents are set inline per section (taxHueStyle in JS): a stable
         hue per domain/layer value, kept off the state hues (green 160 / amber 68
         / red 25). --tint / --tint-soft feed the tiles and the section legend dot. */

      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html {
        background: var(--bg);
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.006em;
      }
      /* fixed shell (detail three-pane fills the viewport) */
      body.fixed {
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      body.fixed header {
        flex: 0 0 auto;
      }
      body.fixed .layout {
        flex: 1 1 auto;
        min-height: 0;
      }

      /* ── header ─────────────────────────────────────────────────────────── */
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 26px;
        height: 54px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }
      .brand {
        font-size: 18.5px;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: var(--fg);
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        font-family: inherit;
      }
      .utils {
        display: flex;
        align-items: center;
        gap: 2px;
        margin-left: 6px;
        padding-left: 10px;
        border-left: 1px solid var(--line);
      }
      .brand .dot {
        color: var(--accent);
      }
      .vault {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--faint);
        background: var(--panel);
        padding: 3px 9px;
        border-radius: 7px;
      }
      nav {
        margin-left: auto;
        display: flex;
        gap: 3px;
      }
      nav a {
        font-size: 13.5px;
        font-weight: 500;
        color: var(--dim);
        text-decoration: none;
        padding: 6px 13px;
        border-radius: 8px;
        cursor: pointer;
      }
      nav a:hover {
        color: var(--fg);
      }
      nav a.on {
        color: var(--accent);
        background: var(--accent-soft);
        font-weight: 600;
      }
      .icon {
        border: 0;
        background: none;
        color: var(--dim);
        cursor: pointer;
        padding: 7px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg {
        display: block;
      }
      .icon:hover {
        background: var(--panel);
        color: var(--fg);
      }

      /* ── buttons ────────────────────────────────────────────────────────── */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 32px;
        box-sizing: border-box;
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        color: var(--fg);
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 9px;
        padding: 0 13px;
        cursor: pointer;
      }
      .btn:hover {
        border-color: var(--accent);
      }
      .btn.primary {
        color: var(--btn-fg);
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 600;
        box-shadow: var(--shadow-sm);
      }
      .btn.danger:hover {
        border-color: var(--err);
        color: var(--err);
      }
      .ghost {
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        color: var(--dim);
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 9px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .ghost:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .new {
        display: inline-flex;
        align-items: center;
        height: 34px;
        box-sizing: border-box;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--btn-fg);
        background: var(--accent);
        border: 0;
        border-radius: 9px;
        padding: 0 14px;
        cursor: pointer;
      }

      /* ── content wrapper (scrolling views) ──────────────────────────────── */
      .pad {
        padding: 24px 26px 80px;
      }
      h1.view {
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin: 6px 0 4px;
      }
      .sub {
        color: var(--dim);
        font-size: 14.5px;
        margin: 0 0 22px;
      }
      .sub b {
        color: var(--ok);
        font-weight: 600;
      }
      .sub a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }

      /* ── search ─────────────────────────────────────────────────────────── */
      .search {
        display: flex;
        align-items: center;
        gap: 11px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 16px;
        margin-bottom: 28px;
        box-shadow: var(--shadow-sm);
      }
      .search input {
        border: 0;
        background: none;
        font: inherit;
        color: var(--fg);
        width: 100%;
        outline: none;
      }
      .search svg {
        opacity: 0.4;
        flex-shrink: 0;
      }

      /* ── badges + chips ─────────────────────────────────────────────────── */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 550;
        padding: 4px 11px;
        border-radius: 999px;
      }
      .badge svg {
        width: 11px;
        height: 11px;
      }
      .badge.ok {
        color: var(--ok);
        background: var(--ok-soft);
      }
      .badge.warn {
        color: var(--warn);
        background: var(--warn-soft);
      }
      .badge.off {
        color: var(--faint);
        background: var(--panel);
      }
      .rtchip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        color: var(--dim);
        background: var(--panel);
        padding: 4px 10px;
        border-radius: 999px;
      }
      .rtchip .d {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
      }

      /* ── taxonomy: command rail + library bar + ledger + chips ─────────── */
      .seg {
        display: inline-flex;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 3px;
        gap: 2px;
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--dim);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 5px 13px;
        border-radius: 6px;
        cursor: pointer;
      }
      .seg button.on {
        background: var(--surface);
        color: var(--fg);
        box-shadow: var(--shadow-sm);
      }
      .seg button:not(.on):hover {
        color: var(--fg);
      }
      .librail .rl {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
        margin: 20px 8px 7px;
      }
      .librail .rl:first-child {
        margin-top: 0;
      }
      .librail .seg {
        display: flex;
        margin: 0 2px;
      }
      .librail .seg button {
        flex: 1;
        font-size: 11.5px;
        padding: 4px 0;
      }
      .ritem {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--dim);
        font: inherit;
        font-size: 13px;
        font-weight: 550;
        padding: 5px 8px;
        border-radius: 7px;
        cursor: pointer;
        text-align: left;
      }
      .ritem:hover {
        background: var(--panel);
        color: var(--fg);
      }
      .ritem.on {
        background: var(--accent-soft);
        color: var(--fg);
        font-weight: 650;
      }
      .ritem .d {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--tint, var(--dim));
        flex: none;
      }
      .ritem .n {
        margin-left: auto;
        font-size: 11px;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
      }
      /* one control height for the whole bar: search, sort seg, view toggle */
      .libbar {
        --ctlh: 40px;
        display: flex;
        align-items: stretch;
        gap: 10px;
        margin-bottom: 24px;
      }
      .libbar .search {
        flex: 1;
        height: var(--ctlh);
        margin-bottom: 0;
        padding: 0 14px;
        box-sizing: border-box;
      }
      .libbar .seg {
        height: var(--ctlh);
        box-sizing: border-box;
        align-items: stretch;
      }
      .libbar .seg button {
        display: inline-flex;
        align-items: center;
        padding: 0 14px;
      }
      .libbar .seg svg {
        width: 15px;
        height: 15px;
        display: block;
      }
      .syncbanner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        background: var(--accent-soft);
        border: 1px solid color-mix(in oklab, var(--accent) 35%, transparent);
        border-radius: 11px;
        padding: 11px 14px;
        margin-bottom: 16px;
        font-size: 13.5px;
      }
      .syncbanner .sbt b {
        font-weight: 650;
      }
      .syncbanner .sba {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .syncbanner .sbx {
        border: 0;
        background: transparent;
        color: var(--dim);
        font: inherit;
        font-size: 17px;
        line-height: 1;
        cursor: pointer;
        padding: 2px 6px;
        border-radius: 6px;
      }
      .syncbanner .sbx:hover {
        color: var(--fg);
        background: var(--panel);
      }
      /* ledger (list view) */
      table.ledger {
        border-collapse: collapse;
        width: 100%;
        /* fixed layout: column widths come from the header, so they stay put
           when filtering hides rows (and the table never exceeds its column) */
        table-layout: fixed;
        font-size: 13.5px;
      }
      table.ledger td {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      table.ledger th {
        text-align: left;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--faint);
        font-weight: 700;
        padding: 7px 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      table.ledger th[data-sort] {
        cursor: pointer;
      }
      table.ledger th[data-sort]:hover {
        color: var(--fg);
      }
      table.ledger td {
        padding: 8px 10px;
        border-bottom: 1px solid
          color-mix(in oklab, var(--line) 55%, transparent);
        vertical-align: middle;
      }
      table.ledger tr.lsec td {
        padding: 16px 10px 6px;
        border-bottom: 1px solid var(--line);
      }
      table.ledger tr[data-skill] {
        cursor: pointer;
      }
      table.ledger tr[data-skill]:hover td {
        background: color-mix(in oklab, var(--panel) 55%, transparent);
      }
      .lsechead {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .lsechead .catdot {
        width: 8px;
        height: 8px;
      }
      .lsechead h2 {
        font-size: 14px;
        margin: 0;
        font-weight: 700;
      }
      .lsechead .n {
        font-size: 11.5px;
        color: var(--dim);
      }
      .lname {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 650;
        white-space: nowrap;
      }
      .ledger .tile {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        font-size: 11px;
      }
      .ledger .tile svg {
        width: 13px;
        height: 13px;
      }
      td.ldesc {
        color: var(--dim);
        font-size: 13px;
      }
      td.lwhen {
        color: var(--faint);
        font-size: 12px;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      td.lnone {
        color: var(--faint);
        font-size: 12px;
      }
      .covlegend {
        font-size: 12px;
        color: var(--faint);
        margin: 2px 0 10px;
      }
      .covlegend b {
        color: var(--dim);
        font-weight: 650;
      }
      .tscroll {
        overflow-x: auto;
      }
      .taxchip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        white-space: nowrap;
        color: var(--tint, var(--dim));
        background: var(--tint-soft, var(--panel));
        padding: 2px 8px;
        border-radius: 6px;
      }
      .taxchip .tcdot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--tint, var(--dim));
        flex: none;
      }
      .badge.bad {
        color: var(--err);
        background: color-mix(in oklab, var(--err) 16%, transparent);
      }
      .badge.acc {
        color: var(--accent);
        background: var(--accent-soft);
      }
      .ledger .badge,
      .coverage .badge {
        font-size: 11.5px;
        padding: 3px 9px;
        white-space: nowrap;
      }
      .taxmiss {
        margin-top: 14px;
        font-size: 13px;
        color: var(--dim);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* ── library ────────────────────────────────────────────────────────── */
      .cat {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin: 28px 0 12px;
      }
      .cat h2 {
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.01em;
        margin: 0;
      }
      .cat .n {
        font-size: 12.5px;
        color: var(--faint);
      }
      .catdot {
        flex: none;
        align-self: center;
        width: 9px;
        height: 9px;
        border-radius: 3px;
        background: var(--tint, var(--accent));
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 14px;
      }
      .card {
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 15px 17px 16px;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        transition:
          transform 0.16s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.16s,
          border-color 0.16s;
      }
      .card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow);
        border-color: color-mix(
          in oklch,
          var(--tint, var(--accent)) 42%,
          var(--line)
        );
      }
      .card.kbsel {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-soft);
      }
      .card {
        position: relative;
      }
      .card .selbox,
      td.selcol .selbox {
        display: inline-flex;
        width: 16px;
        height: 16px;
        border: 1.5px solid var(--line);
        border-radius: 4px;
        background: var(--panel);
      }
      .card .selbox {
        position: absolute;
        top: 10px;
        left: 10px;
        opacity: 0;
        transition: opacity 0.12s;
      }
      .card:hover .selbox,
      .card.sel .selbox {
        opacity: 1;
      }
      .card.sel .selbox,
      tr.sel td.selcol .selbox {
        background: var(--accent);
        border-color: var(--accent);
      }
      .card.sel {
        outline: 1.5px solid var(--accent);
        outline-offset: -1.5px;
        background: var(--accent-soft);
      }
      table.ledger tr.sel td {
        background: var(--accent-soft);
      }
      table.ledger th.selcol,
      table.ledger td.selcol {
        width: 38px;
        min-width: 38px;
        padding-left: 14px;
        padding-right: 0;
        overflow: visible;
        text-overflow: clip;
        text-align: left;
      }
      /* The library area never selects text: a drag there is always a marquee,
         never a native text-selection (grid + list). */
      #groups {
        user-select: none;
        -webkit-user-select: none;
      }
      #marquee {
        position: fixed;
        z-index: 50;
        border: 1px solid var(--accent);
        background: var(--accent-soft);
        pointer-events: none;
        border-radius: 2px;
      }
      .card .top {
        display: flex;
        align-items: flex-start;
        gap: 11px;
      }
      .tile {
        flex: none;
        width: 34px;
        height: 34px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        font-size: 17px;
        line-height: 1;
        background: var(--tint-soft, var(--panel));
        color: var(--tint, var(--dim));
      }
      .tile.mono {
        font-size: 14.5px;
        font-weight: 680;
        letter-spacing: -0.02em;
      }
      .tile .ic {
        width: 18px;
        height: 18px;
        display: block;
      }
      .dochead .tile {
        width: 40px;
        height: 40px;
        border-radius: 11px;
      }
      .dochead .tile.mono {
        font-size: 17px;
      }
      .dochead .tile .ic {
        width: 21px;
        height: 21px;
      }
      .card .headwrap {
        flex: 1;
        min-width: 0;
      }
      .card h3 {
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.015em;
        margin: 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card .when {
        flex: none;
        font-size: 12px;
        color: var(--faint);
        white-space: nowrap;
        padding-top: 2px;
      }
      .card p {
        font-size: 13.5px;
        color: var(--dim);
        line-height: 1.5;
        margin: 11px 0 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 2.85em;
      }
      .card .foot {
        margin-top: auto;
        padding-top: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px 10px;
        flex-wrap: wrap;
      }
      .card .foot-l,
      .card .foot-r {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .archivedlink {
        display: inline-block;
        margin-top: 30px;
        color: var(--dim);
        font-size: 13.5px;
        background: none;
        border: 0;
        cursor: pointer;
        font: inherit;
      }
      .archivedlink:hover {
        color: var(--fg);
      }

      /* ── detail: full-bleed three-pane ──────────────────────────────────── */
      .layout {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr) 300px;
      }
      .rail {
        border-right: 1px solid var(--line);
        background: var(--surface);
        padding: 18px 0;
        overflow-y: auto;
      }
      .rail .crumb {
        display: block;
        color: var(--accent);
        font-weight: 500;
        text-decoration: none;
        font-size: 13px;
        padding: 0 18px 16px;
        cursor: pointer;
      }
      .railh {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--faint);
        font-weight: 600;
        margin: 0;
        padding: 0 18px 10px;
      }
      .file {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 1px 10px;
        padding: 7px 12px;
        border-radius: 9px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--dim);
        cursor: pointer;
      }
      .file.plain {
        font-family: var(--font);
        font-size: 13px;
        justify-content: flex-start;
        gap: 9px;
        align-items: center;
      }
      .file.plain > span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fic {
        flex: none;
        display: inline-flex;
        color: var(--tint, var(--dim));
      }
      .fic svg {
        width: 15px;
        height: 15px;
        display: block;
      }
      .file .sz {
        font-size: 10.5px;
        color: var(--faint);
        flex: none;
        margin-left: auto;
        white-space: nowrap;
        text-align: right;
        min-width: 3.6em;
      }
      /* filename never wraps: the folder prefix truncates first, name+ext always show */
      #filelist .fdir {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--faint);
      }
      #filelist .fname {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #filelist .file.sel .fdir {
        color: var(--accent);
      }
      #filelist .flabel {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: var(--faint);
        padding: 12px 20px 3px;
      }
      .file:hover:not(.sel) {
        background: var(--panel);
      }
      .file.sel {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }
      .rail .group {
        margin-top: 20px;
      }

      .doc {
        padding: 30px 52px 60px;
        overflow-y: auto;
        min-width: 0;
        /* One shared content measure so prose, code blocks, tables and dividers
           all share the same right edge. Fills the document column (no dead
           space); tune this single value to cap the reading width if desired. */
        --measure: 100%;
      }
      /* Refined scrollbars, consistent across every scroll surface (window +
         detail columns + status panes): subtle at rest (never disappears when
         the pointer is over the bar), brighter on hover. */
      html,
      .railtop,
      .railbottom,
      .doc,
      .meta,
      .statuslayout,
      .review,
      .statusrail {
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }
      html:hover,
      .railtop:hover,
      .railbottom:hover,
      .doc:hover,
      .meta:hover,
      .statuslayout:hover,
      .review:hover,
      .statusrail:hover {
        scrollbar-color: var(--faint) transparent;
      }
      html::-webkit-scrollbar,
      .railtop::-webkit-scrollbar,
      .railbottom::-webkit-scrollbar,
      .doc::-webkit-scrollbar,
      .meta::-webkit-scrollbar,
      .statuslayout::-webkit-scrollbar,
      .review::-webkit-scrollbar,
      .statusrail::-webkit-scrollbar {
        width: 11px;
        height: 11px;
      }
      html::-webkit-scrollbar-thumb,
      .railtop::-webkit-scrollbar-thumb,
      .railbottom::-webkit-scrollbar-thumb,
      .doc::-webkit-scrollbar-thumb,
      .meta::-webkit-scrollbar-thumb,
      .statuslayout::-webkit-scrollbar-thumb,
      .review::-webkit-scrollbar-thumb,
      .statusrail::-webkit-scrollbar-thumb {
        background: var(--line);
        border: 3px solid transparent;
        border-radius: 8px;
        background-clip: padding-box;
      }
      html:hover::-webkit-scrollbar-thumb,
      .railtop:hover::-webkit-scrollbar-thumb,
      .railbottom:hover::-webkit-scrollbar-thumb,
      .doc:hover::-webkit-scrollbar-thumb,
      .meta:hover::-webkit-scrollbar-thumb,
      .statuslayout:hover::-webkit-scrollbar-thumb,
      .review:hover::-webkit-scrollbar-thumb,
      .statusrail:hover::-webkit-scrollbar-thumb {
        background: var(--faint);
        background-clip: padding-box;
      }
      html::-webkit-scrollbar-thumb:hover,
      .railtop::-webkit-scrollbar-thumb:hover,
      .railbottom::-webkit-scrollbar-thumb:hover,
      .doc::-webkit-scrollbar-thumb:hover,
      .meta::-webkit-scrollbar-thumb:hover,
      .statuslayout::-webkit-scrollbar-thumb:hover,
      .review::-webkit-scrollbar-thumb:hover,
      .statusrail::-webkit-scrollbar-thumb:hover {
        background: var(--fg);
        background-clip: padding-box;
      }
      .dochead {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .dochead h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.025em;
        margin: 0;
      }
      .dochead .acts {
        margin-left: auto;
        display: flex;
        gap: 8px;
      }
      .desc {
        color: var(--dim);
        max-width: 74ch;
        margin: 8px 0 22px;
        font-size: 14px;
      }
      .desc .name {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--faint);
      }
      .viewerbar {
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 10px;
        margin-bottom: 24px;
      }
      .viewerbar .fname {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--faint);
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .seg {
        margin-left: auto;
        display: inline-flex;
        background: var(--panel);
        border-radius: 8px;
        padding: 2px;
      }
      /* keep the toggle's footprint so the header/body divider never jumps
         between markdown (toggle shown) and non-markdown files (toggle hidden) */
      .seg.vhide {
        visibility: hidden;
      }
      .seg b,
      .seg span {
        font-size: 11.5px;
        padding: 4px 12px;
        border-radius: 6px;
        cursor: pointer;
      }
      .seg b {
        background: var(--surface);
        font-weight: 600;
        box-shadow: var(--shadow-sm);
      }
      .seg span {
        color: var(--faint);
      }

      .meta {
        border-left: 1px solid var(--line);
        background: var(--surface);
        padding: 18px 0;
        overflow-y: auto;
      }
      .meta .sect {
        padding: 0 18px 20px;
      }
      .rt {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 7px 0;
        font-size: 13.5px;
      }
      .rt .who {
        color: var(--dim);
      }
      .rt .st {
        font-size: 12px;
        color: var(--ok);
        font-weight: 550;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .rt .st::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .commit {
        padding: 10px 18px;
        cursor: pointer;
        border-top: 1px solid var(--hair);
      }
      .commit:hover {
        background: var(--panel);
      }
      .commit.sel {
        background: var(--accent-soft);
      }
      .commit .s {
        font-size: 13px;
        font-weight: 500;
        margin: 0 0 2px;
      }
      .commit .d {
        font-size: 11px;
        color: var(--faint);
      }
      .commit .seewhat {
        font-size: 11px;
        color: var(--accent);
        font-weight: 500;
      }

      /* ── markdown document body ─────────────────────────────────────────── */
      /* Body prose sits one step below --fg so bold and headings (kept at
         --fg) visibly stand out, especially in dark mode. */
      .md {
        color: var(--prose);
      }
      .md h1,
      .md h2,
      .md h3,
      .md h4 {
        color: var(--fg);
      }
      .md strong {
        color: var(--prose-b);
      }
      .md .lede {
        font-size: 16.5px;
        line-height: 1.6;
        margin: 0 0 8px;
        max-width: var(--measure);
      }
      .md h2 {
        font-size: 17px;
        font-weight: 650;
        letter-spacing: -0.02em;
        margin: 1.5em 0 0.5em;
      }
      .md h3 {
        font-size: 14.5px;
        font-weight: 650;
        margin: 1.1em 0 0.35em;
      }
      .md p {
        font-size: 15px;
        line-height: 1.64;
        margin: 0.5em 0;
        max-width: var(--measure);
      }
      .md strong {
        font-weight: 650;
      }
      .md a {
        color: var(--accent);
      }
      .md code {
        font-family: var(--mono);
        font-size: 0.95em;
        background: var(--panel);
        padding: 1px 6px;
        border-radius: 5px;
      }
      .md pre {
        font-family: var(--mono);
        font-size: 12.5px;
        background: var(--panel);
        border-radius: 10px;
        padding: 14px 16px;
        overflow-x: auto;
        line-height: 1.7;
        color: var(--dim);
        max-width: var(--measure);
      }
      .md pre code {
        background: none;
        padding: 0;
      }
      .md table {
        border-collapse: collapse;
        width: 100%;
        max-width: var(--measure);
        margin: 1.1em 0;
        font-size: 13.5px;
      }
      .md th {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--faint);
        text-align: left;
        padding: 8px 14px 8px 0;
        border-bottom: 1.5px solid var(--line);
      }
      .md td {
        padding: 10px 14px 10px 0;
        border-bottom: 1px solid var(--hair);
        vertical-align: top;
      }
      .md td code {
        font-size: 11.5px;
      }
      .md ul,
      .md ol {
        padding-left: 20px;
        margin: 0.9em 0;
        max-width: var(--measure);
      }
      .md li {
        font-size: 14.5px;
        line-height: 1.62;
        margin: 0.5em 0;
      }
      /* Blockquotes align to the same indent as lists (no side-stripe border),
         set apart by muted colour only. */
      .md blockquote {
        margin: 0.6em 0;
        padding-left: 20px;
        max-width: var(--measure);
        color: var(--dim);
      }
      /* Divider: matches the shared measure, with generous vertical breathing room */
      .md hr {
        max-width: var(--measure);
        margin: 2em 0;
        border: 0;
        border-top: 1px solid var(--line);
      }
      /* Task-list items: real checkbox in the list gutter instead of literal [ ] */
      .md li.task {
        list-style: none;
        position: relative;
      }
      .md li.task::before {
        content: "";
        position: absolute;
        left: -20px;
        top: 0.3em;
        width: 12px;
        height: 12px;
        border: 1.5px solid var(--line);
        border-radius: 3.5px;
      }
      .md li.task.done::before {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .md li.task.done::after {
        content: "";
        position: absolute;
        left: -15px;
        top: 0.42em;
        width: 4px;
        height: 7px;
        border: solid var(--accent);
        border-width: 0 1.5px 1.5px 0;
        transform: rotate(45deg);
      }

      /* ── health ─────────────────────────────────────────────────────────── */
      .goodchip {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: var(--ok);
        background: var(--ok-soft);
        font-size: 15px;
        font-weight: 600;
        padding: 11px 18px;
        border-radius: 999px;
        margin-bottom: 22px;
      }
      .issue {
        padding: 13px 15px;
        border-radius: 11px;
        background: var(--warn-soft);
        color: var(--fg);
        font-size: 13.5px;
        line-height: 1.5;
        margin-bottom: 9px;
        max-width: 92ch;
        border: 1px solid transparent;
      }
      .issue.crit {
        background: var(--err-soft);
      }
      .syncbox {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 18px 20px;
        margin: 22px 0;
        box-shadow: var(--shadow-sm);
        max-width: 92ch;
      }
      .syncbox p {
        margin: 0;
        font-size: 14px;
      }
      .syncbox .row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      details.tech {
        margin-top: 30px;
      }
      details.tech summary {
        cursor: pointer;
        color: var(--dim);
        font-weight: 500;
        font-size: 12.5px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 14px;
      }
      .rowactions {
        display: flex;
        gap: 8px;
        margin: 0 0 14px;
      }
      table.grid {
        display: table; /* beat the `.grid` (display:grid) card-grid rule */
        border-collapse: collapse;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 11px;
        overflow: hidden;
      }
      table.grid th {
        color: var(--faint);
        font-weight: 600;
        text-transform: uppercase;
        font-size: 10.5px;
        letter-spacing: 0.06em;
        text-align: left;
        padding: 9px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      table.grid td {
        padding: 9px 14px;
        border-bottom: 1px solid var(--hair);
        font-size: 13px;
        vertical-align: middle;
      }
      table.grid tr:last-child td {
        border-bottom: 0;
      }
      table.grid .mono {
        font-family: var(--mono);
        font-size: 12.5px;
      }
      .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: 0;
      }
      .dot.linked {
        background: var(--ok);
      }
      .dot.missing {
        background: var(--faint);
        opacity: 0.5;
      }
      .dot.broken {
        background: var(--err);
      }
      .dot.foreign {
        background: var(--warn);
      }

      /* ── changes ────────────────────────────────────────────────────────── */
      .changes-list {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 4px 16px;
        margin-bottom: 18px;
      }
      .changeline {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 4px;
        border-bottom: 1px solid var(--hair);
        font-size: 13.5px;
      }
      .changeline:last-child {
        border-bottom: 0;
      }
      .changeline .path {
        font-family: var(--mono);
        font-size: 12.5px;
        color: var(--fg);
      }
      .changeline a.open {
        margin-left: auto;
        color: var(--accent);
        font-size: 12.5px;
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
      }
      pre.plain {
        overflow-x: auto;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 14px 16px;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.6;
        margin: 0;
      }
      pre.plain.wrap {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      /* ── syntax highlighting theme ──────────────────────────────────────── */
      .tok-com {
        color: var(--faint);
        font-style: italic;
      }
      .tok-kw {
        color: oklch(52% 0.15 300);
      }
      .tok-str {
        color: oklch(48% 0.13 150);
      }
      .tok-num {
        color: oklch(52% 0.14 55);
      }
      .tok-bool {
        color: oklch(50% 0.13 190);
      }
      .tok-fn {
        color: oklch(49% 0.13 255);
      }
      .tok-prop {
        color: oklch(48% 0.12 205);
      }
      .tok-tag {
        color: oklch(52% 0.16 20);
      }
      .tok-attr {
        color: oklch(52% 0.13 75);
      }
      .tok-punct {
        color: var(--dim);
      }
      @media (prefers-color-scheme: dark) {
        .tok-kw {
          color: oklch(80% 0.12 300);
        }
        .tok-str {
          color: oklch(78% 0.13 150);
        }
        .tok-num {
          color: oklch(80% 0.11 55);
        }
        .tok-bool {
          color: oklch(78% 0.11 190);
        }
        .tok-fn {
          color: oklch(78% 0.12 255);
        }
        .tok-prop {
          color: oklch(80% 0.1 205);
        }
        .tok-tag {
          color: oklch(77% 0.14 20);
        }
        .tok-attr {
          color: oklch(81% 0.12 75);
        }
      }
      .dadd {
        color: var(--ok);
      }
      .ddel {
        color: var(--err);
      }
      .dmeta {
        color: var(--faint);
      }
      /* ── keyboard help ──────────────────────────────────────────────────── */
      .hutils {
        display: flex;
        gap: 2px;
      }
      #helpov {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: oklch(0% 0 0 / 0.4);
      }
      .helpcard {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 22px 24px;
        min-width: 344px;
      }
      .helphd {
        font-size: 13px;
        font-weight: 650;
        margin-bottom: 14px;
        color: var(--fg);
      }
      .helprow {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 5px 0;
      }
      .helprow kbd {
        flex: none;
        min-width: 82px;
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 3px 8px;
        text-align: center;
      }
      .helprow span {
        font-size: 13px;
        color: var(--dim);
      }
      /* ── skill context menu ─────────────────────────────────────────────── */
      .ctxmenu {
        position: fixed;
        z-index: 60;
        min-width: 180px;
        padding: 4px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
        font-size: 13px;
      }
      .ctxhd {
        padding: 6px 10px;
        color: var(--faint);
        font-weight: 600;
        border-bottom: 1px solid var(--line);
        margin-bottom: 4px;
      }
      .ctxitem {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        padding: 7px 10px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        text-align: left;
        cursor: pointer;
        position: relative;
      }
      .ctxitem:hover {
        background: var(--accent-soft);
      }
      .ctxitem.disabled {
        color: var(--faint);
        cursor: default;
      }
      .ctxitem.disabled:hover {
        background: transparent;
      }
      .ctxarr {
        color: var(--faint);
      }
      .ctxsub {
        display: none;
        position: absolute;
        left: 100%;
        top: -5px;
        min-width: 160px;
        padding: 4px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
      }
      .ctxitem.has-sub:hover > .ctxsub {
        display: block;
      }
      .empty {
        color: var(--dim);
        padding: 22px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 11px;
        max-width: 92ch;
      }
      /* the library "no matches" box spans the content, not the 92ch prose cap */
      #noresult {
        max-width: none;
      }

      /* ── form controls ──────────────────────────────────────────────────── */
      label.field {
        display: block;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--faint);
        margin-bottom: 6px;
      }
      input.txt,
      select.txt,
      textarea.txt {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--surface);
        color: var(--fg);
        font: inherit;
        font-size: 14px;
        outline: none;
      }
      input.txt::placeholder,
      textarea.txt::placeholder {
        color: var(--faint);
      }
      input.txt:focus,
      select.txt:focus,
      textarea.txt:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      textarea.txt {
        min-height: 84px;
        resize: vertical;
        line-height: 1.5;
      }
      .field-row {
        margin-bottom: 18px;
      }
      .hint {
        font-size: 12px;
        color: var(--faint);
        margin-top: 6px;
        line-height: 1.5;
      }
      .hint .mono {
        font-family: var(--mono);
        color: var(--dim);
      }

      /* ── dialog + toast ─────────────────────────────────────────────────── */
      dialog {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        color: var(--fg);
        max-width: 540px;
        padding: 22px;
        box-shadow: var(--shadow);
      }
      dialog::backdrop {
        background: oklch(20% 0.02 245 / 0.45);
      }
      dialog h2 {
        margin: 0 0 12px;
        font-size: 17px;
        font-weight: 650;
      }
      dialog ul {
        font-size: 13.5px;
        line-height: 1.5;
        padding-left: 18px;
        max-height: 40vh;
        overflow: auto;
      }
      .dialog-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 16px;
      }
      #toast {
        position: fixed;
        bottom: 22px;
        right: 22px;
        background: var(--fg);
        color: var(--bg);
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 13px;
        max-width: 44ch;
        box-shadow: var(--shadow);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      #toast.show {
        opacity: 1;
      }
      /* ── view-specific layout (on top of teal.css design system) ─────────── */

      /* body shells: scrolling views vs full-bleed fixed views (detail, status) */
      body {
        min-height: 100vh;
      }
      body.fixed {
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      body.fixed header {
        flex: 0 0 auto;
      }
      body.fixed #app {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
      }
      body.fixed #app > .layout,
      body.fixed #app > .statuslayout,
      body.fixed #app > .liblayout,
      body.fixed #app > .configlayout {
        flex: 1 1 auto;
        min-height: 0;
      }

      /* smooth view transitions: fade the newly-inserted view (opacity only) */
      @keyframes loomfade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      #app > * {
        animation: loomfade 0.15s ease-out;
      }
      /* A same-view refresh (data reload) must not re-fade the whole view — that
         reads as a background flash. The fade is only for real view changes. */
      #app.norefade > * {
        animation: none;
      }
      /* Top navigation progress bar (Linear-style): a thin accent line that fills
         while an async view loads, then completes and fades. */
      #navprog {
        position: fixed;
        top: 0;
        left: 0;
        height: 2px;
        width: 0;
        background: var(--accent);
        opacity: 0;
        z-index: 20;
        pointer-events: none;
        transition:
          width 0.2s ease-out,
          opacity 0.25s ease-out 0.15s;
      }
      #navprog.loading {
        width: 82%;
        opacity: 1;
        transition:
          width 8s cubic-bezier(0.1, 0.9, 0.2, 1),
          opacity 0.1s;
      }
      #navprog.done {
        width: 100%;
        opacity: 0;
        transition:
          width 0.15s ease-out,
          opacity 0.3s ease-out 0.1s;
      }

      /* library: full-bleed two-pane (rail on --bg, main on --surface) */
      .liblayout {
        display: grid;
        grid-template-columns: 236px minmax(0, 1fr);
      }
      .liblayout .librail {
        min-height: 0;
        overflow-y: auto;
        background: var(--bg);
        border-right: 1px solid var(--line);
        padding: 20px 14px 28px;
      }
      .libmain {
        min-height: 0;
        min-width: 0;
        overflow-y: auto;
        background: var(--surface);
        padding: 26px 36px 90px;
      }
      .libmain .grid {
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      }
      @media (max-width: 900px) {
        .liblayout {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }
        .liblayout .librail {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          max-height: 36vh;
        }
      }
      .catsec {
        margin-bottom: 4px;
      }
      .libhead {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 6px 0 18px;
      }
      .libhead .sub {
        margin: 4px 0 0;
      }
      .libhead h1.view {
        margin: 0;
      }
      .libhead .new {
        margin-left: auto;
      }
      h1.view {
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin: 6px 0 4px;
      }

      /* detail three-pane */
      .layout {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr) 300px;
      }
      /* grid children must be allowed to shrink so each column scrolls on its own */
      .layout > * {
        min-height: 0;
      }
      .rail .crumb {
        display: block;
        color: var(--accent);
        font-weight: 500;
        text-decoration: none;
        font-size: 13px;
        padding: 0 18px 16px;
        cursor: pointer;
      }
      .rail {
        border-right: 1px solid var(--line);
        background: var(--surface);
        padding: 18px 0 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      /* Files scroll in the top region; the skill list is pinned to a fixed
         height at the bottom (VS Code style) so it never shifts with file count. */
      .railtop {
        flex: 1 1 0;
        min-height: 0;
        overflow-y: auto;
        padding-bottom: 14px;
      }
      .railbottom {
        flex: 0 0 46%;
        overflow-y: auto;
        border-top: 1px solid var(--line);
        padding: 14px 0;
      }
      /* category-nav header reads as a section title, distinct from the tiny FILES label */
      .railh.nav {
        text-transform: none;
        letter-spacing: 0;
        font-size: 12.5px;
        font-weight: 650;
        color: var(--dim);
      }
      .dochead {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .dochead h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.025em;
        margin: 0;
      }
      .dochead .acts {
        margin-left: auto;
        display: flex;
        gap: 8px;
      }
      .descmeta {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 13px 0 14px;
        font-size: 12.5px;
        color: var(--faint);
      }
      .desc {
        color: var(--dim);
        max-width: 72ch;
        /* Symmetric top/bottom so the gap to the taxonomy chips above and to the
           metadata below reads as one rhythm, not two different sizes. */
        margin: 16px 0;
        font-size: 14.5px;
        line-height: 1.62;
      }
      .meta {
        border-left: 1px solid var(--line);
        background: var(--surface);
        padding: 18px 0;
        overflow-y: auto;
      }
      .meta .sect {
        padding: 0 18px 20px;
      }

      /* status: work area + status/action rail */
      .statuslayout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
      }
      .review {
        overflow-y: auto;
        padding: 24px 40px 60px;
        min-width: 0;
      }
      /* Skill-detail document: centre it as one readable column (title, viewerbar
         and body together) with balanced margins that grow with the pane, capped
         at ~56rem so lines stay readable on wide monitors. */
      .doc.review {
        padding: 24px max(40px, calc(50% - 28rem)) 60px;
      }
      /* Body fills the centred column and aligns with the header (drop the
         article's own side inset). */
      #viewer .md {
        padding-left: 0;
        padding-right: 0;
      }
      .rvhead {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 6px;
      }
      .rvhead h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.025em;
        margin: 0;
      }
      .rvhead .count {
        font-size: 12px;
        color: var(--faint);
        background: var(--panel);
        padding: 3px 9px;
        border-radius: 999px;
      }
      .rvhead .spacer {
        margin-left: auto;
      }
      .rvsub {
        color: var(--dim);
        font-size: 13.5px;
        margin: 0 0 22px;
      }
      .savedstate {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 22px;
        border: 1px dashed var(--line);
        border-radius: 14px;
        color: var(--dim);
        font-size: 14px;
      }
      .savedstate .ic {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--ok-soft);
        color: var(--ok);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
      }
      .savedstate b {
        color: var(--fg);
        font-weight: 650;
      }
      .clist {
        border-top: 1px solid var(--hair);
      }
      .crow {
        border-bottom: 1px solid var(--hair);
      }
      .crow > summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 2px;
      }
      .crow > summary::-webkit-details-marker {
        display: none;
      }
      .crow .skname {
        font-weight: 600;
        font-size: 14.5px;
        letter-spacing: -0.01em;
      }
      .crow .what {
        color: var(--dim);
        font-size: 13px;
      }
      .crow .path {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--faint);
        margin-left: auto;
      }
      .crow .chev {
        color: var(--faint);
        transition: transform 0.15s;
        flex: 0 0 auto;
      }
      .crow[open] .chev {
        transform: rotate(90deg);
      }
      .crow .diff {
        padding: 2px 2px 18px;
      }
      .review .tail {
        color: var(--faint);
        font-size: 13px;
        padding: 20px 2px;
      }
      .coverage {
        margin-top: 40px;
        padding-top: 28px;
        border-top: 1px solid var(--line);
      }
      .covhead {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 12px;
      }
      .covhead h2 {
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.01em;
        margin: 0;
      }
      .covhead .cnt {
        font-size: 12px;
        color: var(--faint);
      }
      .covhead .spacer {
        margin-left: auto;
      }
      .coverage table.grid td:first-child {
        width: 40%;
      }
      .coverage .cst {
        color: var(--ok);
        font-weight: 500;
      }
      .coverage .cst.bad {
        color: var(--warn);
      }
      .coverage .cst.off {
        color: var(--faint);
      }
      .covmore {
        font-size: 12.5px;
        color: var(--faint);
        padding: 10px 14px;
      }
      .statusrail {
        border-left: 1px solid var(--line);
        background: var(--surface);
        overflow-y: auto;
        padding: 22px 22px 40px;
      }
      .rblock {
        padding-bottom: 26px;
        margin-bottom: 26px;
        border-bottom: 1px solid var(--line);
      }
      .rblock:last-child {
        border-bottom: 0;
        margin-bottom: 0;
      }
      .rh {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--dim);
        font-weight: 600;
        margin: 0 0 12px;
      }
      .verdict {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .verdict .d {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex: 0 0 auto;
      }
      .verdict.warn .d {
        background: var(--warn);
      }
      .verdict.ok .d {
        background: var(--ok);
      }
      .vsupport {
        display: flex;
        flex-direction: column;
        gap: 7px;
        margin-top: 12px;
      }
      .vitem {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--dim);
      }
      .vitem .mini {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex: 0 0 auto;
      }
      .mini.ok {
        background: var(--ok);
      }
      .mini.warn {
        background: var(--warn);
      }
      .mini.off {
        background: var(--faint);
        opacity: 0.5;
      }
      .rline {
        font-size: 13.5px;
        color: var(--dim);
        line-height: 1.5;
        margin: 0 0 12px;
      }
      .rline b {
        color: var(--fg);
        font-weight: 600;
      }
      .rmeta {
        font-size: 12px;
        color: var(--faint);
        margin-top: 12px;
      }

      /* new skill */
      .newwrap {
        max-width: 940px;
        margin: 0 auto;
        padding: 34px 26px 80px;
      }
      .newwrap h1 {
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin: 0 0 4px;
      }
      .newgrid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 34px;
        align-items: start;
      }
      .plan {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px 18px 20px;
      }
      .plan .tree {
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.7;
        color: var(--dim);
        white-space: pre;
      }
      .plan .tree .accent {
        color: var(--accent);
      }
      .plan .fmbox {
        margin-top: 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 11px 13px;
        font-family: var(--mono);
        font-size: 11.5px;
        line-height: 1.65;
        color: var(--dim);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .plan .fmbox .k {
        color: var(--faint);
      }
      .plan .fmbox .c {
        color: var(--faint);
        opacity: 0.72;
      }
      .plan .runrow {
        margin-top: 18px;
        font-size: 13px;
        color: var(--dim);
      }
      .plan .runrow .rl {
        display: block;
        margin-bottom: 9px;
      }
      .plan .runrow .rtchips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .newactions {
        display: flex;
        gap: 10px;
        margin-top: 26px;
        align-items: center;
      }
      .newactions .note {
        font-size: 12.5px;
        color: var(--faint);
        margin-left: auto;
      }
      .field .req {
        margin-left: 7px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0;
        text-transform: none;
        color: var(--warn);
      }
      #n-desccount {
        font-variant-numeric: tabular-nums;
      }
      #n-desccount.ok {
        color: var(--ok);
      }
      #n-desccount.warn {
        color: var(--warn);
      }

      /* config */
      .setwrap {
        max-width: 1040px;
        margin: 0 auto;
        padding: 32px 26px 80px;
      }
      .setwrap h1 {
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin: 0 0 26px;
      }
      /* config: settings console (rail + active pane) */
      .console {
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 26px;
      }
      /* config full-bleed: rail on --bg (full height) + a --surface pane whose
         content lives in one centered column, matching the library/status
         views' full-bleed shell so Config is no longer a narrow centered box. */
      .configlayout {
        display: grid;
        grid-template-columns: 236px minmax(0, 1fr);
      }
      .setnav.cfgrail {
        position: static;
        top: auto;
        align-self: stretch;
        justify-self: stretch;
        width: 100%;
        min-height: 0;
        overflow-y: auto;
        background: var(--bg);
        border-right: 1px solid var(--line);
        padding: 20px 12px 28px;
      }
      .cfgmain {
        min-height: 0;
        min-width: 0;
        overflow-y: auto;
        background: var(--surface);
        padding: 28px 36px 90px;
      }
      /* One content column, centered, same width on every pane so the box does
         not resize when switching sections. Wide enough for the forms; the doc
         panes fill it too (no tighter per-pane cap). */
      .cfgcol {
        max-width: 880px;
        margin: 0 auto;
      }
      .cfgcol h1 {
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin: 0 0 6px;
      }
      @media (max-width: 900px) {
        .configlayout {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }
        .setnav.cfgrail {
          align-self: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }
      .setnav {
        display: flex;
        flex-direction: column;
        gap: 2px;
        position: sticky;
        top: 70px;
        align-self: start;
      }
      .setnav a {
        font-size: 13.5px;
        color: var(--dim);
        padding: 8px 12px;
        border-radius: 9px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .setnav a:hover {
        background: var(--panel);
      }
      .setnav a.on {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }
      .setnav .tiny {
        font-size: 10.5px;
        color: var(--faint);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .setnav a.on .tiny {
        color: var(--accent);
      }
      .setnav .sep {
        height: 1px;
        background: var(--line);
        margin: 9px 6px;
      }
      .railref {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--faint);
        font-weight: 700;
        padding: 2px 12px 6px;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }
      .panel-h {
        padding: 20px 24px 16px;
        border-bottom: 1px solid var(--hair);
      }
      .panel-h h2 {
        font-size: 17px;
      }
      .panel-h p {
        margin: 5px 0 0;
        color: var(--dim);
        font-size: 13.5px;
        max-width: 66ch;
      }
      .srow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 15px 24px;
        border-bottom: 1px solid var(--hair);
      }
      .srow:last-of-type {
        border-bottom: 0;
      }
      .srow .lbl {
        font-size: 13.5px;
        font-weight: 550;
      }
      .srow .subv {
        font-size: 12.5px;
        color: var(--faint);
        margin-top: 3px;
      }
      .srow .val {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .srow .path {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--dim);
      }
      .addrow {
        padding: 14px 24px;
      }
      /* The un-wrapped code viewer (loom.json / non-.md reference docs) sits as
         a direct child of #doc-body. The direct-child combinator keeps this off
         fenced code blocks inside a rendered .md doc (which are deeper). Font
         matches the skill detail's Source view (12px). */
      #doc-body > pre.code {
        margin: 0;
        padding: 20px 24px;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.65;
        color: var(--prose);
        overflow: auto;
        white-space: pre;
      }
      /* Reference / loom.json pane: a Document | History toggle in the panel
         header (same pattern as the skill detail's Rendered / Source). The
         History view lists commits in the pane body; each expands its diff. */
      .panel-h .ph-top {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .panel-h .ph-top h2 {
        margin: 0 auto 0 0;
      }
      /* docrev + toggle group at the right; the shared .seg carries the exact
         Rendered/Source look, so no per-toggle overrides. */
      .panel-h .ph-top .seg {
        margin-left: 0;
      }
      .docrev {
        font-size: 12.5px;
        color: var(--dim);
      }
      .dochistv {
        padding: 4px 24px 24px;
      }
      #doc-body .dcommit {
        padding: 13px 0;
        border-top: 1px solid var(--hair);
        cursor: pointer;
      }
      #doc-body .dcommit:first-child {
        border-top: 0;
      }
      #doc-body .dctop {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      #doc-body .dcommit .s {
        font-size: 13.5px;
        color: var(--fg);
      }
      #doc-body .dcommit .d {
        font-size: 12px;
        color: var(--dim);
      }
      #doc-body .seewhat {
        color: var(--accent);
      }
      #doc-body .dcdiff {
        margin-top: 10px;
      }
      /* the diff sits inside the pane already; drop the bordered box so it does
         not read as a box-in-a-box. */
      #doc-body .dcdiff pre.plain {
        border: 0;
        background: var(--panel);
        font-size: 11.5px;
      }
      /* Scoped to .panel: the bare .doc class already styles the skill-
         detail three-pane document column (padding 30px 52px 60px, see
         line ~1055); that must stay untouched. Inside a Config panel the
         narrower panel-consistent padding applies instead, via specificity
         (not source order), so it can't drift if the file is reorganized. */
      .panel .doc {
        padding: 22px 26px;
      }
      /* Secondary-file frontmatter, rendered as a compact metadata card at the
         top of the document (instead of a raw dim YAML blob). */
      .fmcard {
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--surface);
        margin: 6px 0 18px;
        overflow: hidden;
      }
      .fmcard .fh {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
      }
      /* Nested frontmatter value (recursive): indented sub-rows, no colored
         side-border. Shared by the card and the detail rail. */
      .fmsub {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding-left: 12px;
        margin-top: 5px;
      }
      .fmsubrow {
        display: flex;
        gap: 8px;
        align-items: baseline;
        font-size: 12.5px;
      }
      .fmsubrow > .fmk {
        flex: none;
      }
      .fmsubrow > .fmv {
        min-width: 0;
      }
      /* a nested value stacks under its key instead of sitting beside it */
      .fmsubrow.nested {
        display: block;
      }
      /* Skill detail: taxonomy/status chips in the header. */
      .detmeta {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        /* No bottom padding: the description's symmetric 16px top margin owns the
           gap to the chips, matching the description-to-metadata gap below. */
        padding: 10px 0 0;
      }
      /* Skill metadata, below the description in the main column. No divider, no
         header: sources are bare chips, a waiver is a soft note, so it reads as
         part of the document rather than a labelled panel. */
      .skillmeta {
        margin: 16px 0 20px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 11px;
      }
      .skillmeta .smchips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      /* Runtime flag (e.g. always-injected): an accent chip in relief, distinct
         from the neutral source chips. */
      .skillmeta .injchip {
        font-family: var(--mono);
        font-size: 10.5px;
        font-weight: 600;
        color: var(--accent);
        background: var(--accent-soft);
        border-radius: 20px;
        padding: 3px 10px;
      }
      /* Waiver = a soft note (accent-soft, rounded, no side-stripe): a documented
         exception, present but not alarming. */
      .skillmeta .smnote {
        align-self: stretch;
        background: var(--accent-soft);

  <body>

        <input class="txt" id="rb-a" />
      </div>

        <label class="field" for="rb-b">Replace with</label>
        <input class="txt" id="rb-b" />
      </div>

    <div id="toast"></div>
    <script>
      const $ = (s) => document.querySelector(s);
      const app = () => document.getElementById("app");
      let state = null,
        sync = null;
      let curView = "skills",
        current = null;
      let currentFile = null,
        currentFileData = null,
        viewMode = "rendered";

      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      async function api(route, body) {
        const opts =
          body === undefined
            ? {}
            : {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(body),
              };
        const res = await fetch(route, opts);
        let data = {};
        try {
          data = await res.json();
        } catch {}
        return { ok: res.ok, status: res.status, data };
      }
      function toast(msg) {
        const el = $("#toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove("show"), 2800);
      }
      function comingSoon(label) {
        toast(label + " — arrives with the next backend step");
      }
      function confirmActions(title, actions) {
        return new Promise((resolve) => {
          $("#confirm-title").textContent = title;
          $("#confirm-actions").innerHTML = actions
            .map((a) => `<li>${esc(a)}</li>`)
            .join("");
          const dlg = $("#confirm"),
            yes = $("#confirm-yes"),
            no = $("#confirm-no");
          const done = (v) => {
            yes.removeEventListener("click", oy);
            no.removeEventListener("click", on);
            dlg.removeEventListener("close", oc);
            dlg.close();
            resolve(v);
          };
          const oy = () => done(true),
            on = () => done(false);
          // "close" fires as a queued task; see promptDialog for why we gate
          // on dlg.open (only a genuine Esc/backdrop dismissal has it false).
          const oc = () => {
            if (!dlg.open) done(false);
          };
          yes.addEventListener("click", oy);
          no.addEventListener("click", on);
          dlg.addEventListener("close", oc);
          dlg.showModal();
        });
      }
      // In-app replacement for window.prompt(): resolves to the entered string
      // (possibly ""), or null on Cancel / Esc / backdrop — same contract as prompt().
      function promptDialog(title, value = "", okLabel = "OK") {
        return new Promise((resolve) => {
          const dlg = $("#prompt"),
            input = $("#prompt-input"),
            yes = $("#prompt-yes"),
            no = $("#prompt-no");
          $("#prompt-title").textContent = title;
          input.value = value ?? "";
          yes.textContent = okLabel;
          const done = (v) => {
            yes.removeEventListener("click", oy);
            no.removeEventListener("click", on);
            dlg.removeEventListener("close", oc);
            input.removeEventListener("keydown", onKey);
            dlg.close();
            resolve(v);
          };
          const oy = () => done(input.value);
          const on = () => done(null);
          // "close" fires as a queued task: when two prompts chain, the first
          // dialog's close lands AFTER the second showModal() and would kill
          // it. A genuine close always has dlg.open === false; ignore the rest.
          const oc = () => {
            if (!dlg.open) done(null);
          };
          const onKey = (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              done(input.value);
            }
          };
          yes.addEventListener("click", oy);
          no.addEventListener("click", on);
          dlg.addEventListener("close", oc);
          input.addEventListener("keydown", onKey);
          dlg.showModal();
          input.focus();
          input.select();
        });
      }
      // Collects a rename pattern transform for a multi-select. Resolves to
      // { op, value } | { op, from, to } or null on cancel. The label of the first
      // field and the visibility of the second track the chosen op.
      function renameTransformDialog(count) {
        return new Promise((resolve) => {
          const dlg = $("#renamebulk"),
            op = $("#rb-op"),
            a = $("#rb-a"),
            b = $("#rb-b"),
            labelA = $("#rb-label-a"),
            rowB = $("#rb-row-b"),
            yes = $("#renamebulk-yes"),
            no = $("#renamebulk-no");
          $("#renamebulk-title").textContent = `Rename ${count} skills`;
          a.value = "";
          b.value = "";
          const sync = () => {
            const isReplace = op.value === "replace";
            labelA.textContent = isReplace
              ? "Find"
              : op.value === "strip-prefix"
                ? "Prefix to strip"
                : "Prefix";
            rowB.hidden = !isReplace;
          };
          op.value = "add-prefix";
          sync();
          const done = (v) => {
            op.removeEventListener("change", sync);
            yes.removeEventListener("click", oy);
            no.removeEventListener("click", on);
            dlg.removeEventListener("close", oc);
            dlg.close();
            resolve(v);
          };
          const oy = () => {
            if (op.value === "replace")
              done({ op: "replace", from: a.value, to: b.value });
            else done({ op: op.value, value: a.value });
          };
          const on = () => done(null);
          // "close" fires as a queued task; see promptDialog for why we gate
          // on dlg.open (only a genuine Esc/backdrop dismissal has it false).
