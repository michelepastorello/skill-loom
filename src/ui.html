<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>skill-loom</title>
    <link rel="stylesheet" href="/ui.css" />
  </head>
  <body>
    <header>
      <button class="brand" data-go="skills">
        skill-loom<span class="dot">.</span>
      </button>
      <span class="vault" id="vault"></span>
      <nav>
        <a data-go="skills" id="nav-skills">My skills</a>
        <a data-go="status" id="nav-status">Status</a>
        <a data-go="config" id="nav-config">Config</a>
      </nav>
      <div class="hutils">
        <button
          class="icon"
          id="refresh"
          title="Refresh (r)"
          aria-label="Refresh"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <path d="M21 3v5h-5" />
          </svg>
        </button>
        <button
          class="icon"
          id="help-btn"
          title="Keyboard shortcuts (?)"
          aria-label="Keyboard shortcuts"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
            <path d="M12 17h.01" />
          </svg>
        </button>
      </div>
    </header>
    <div id="navprog" aria-hidden="true"></div>
    <div id="app"></div>
    <dialog id="confirm">
      <h2 id="confirm-title"></h2>
      <ul id="confirm-actions"></ul>
      <div class="dialog-actions">
        <button id="confirm-no" class="btn">Cancel</button
        ><button id="confirm-yes" class="btn primary">Confirm</button>
      </div>
    </dialog>
    <dialog id="prompt">
      <h2 id="prompt-title"></h2>
      <input
        id="prompt-input"
        class="txt"
        type="text"
        spellcheck="false"
        autocomplete="off"
      />
      <div class="dialog-actions">
        <button id="prompt-no" class="btn">Cancel</button
        ><button id="prompt-yes" class="btn primary">OK</button>
      </div>
    </dialog>
    <dialog id="renamebulk">
      <h2 id="renamebulk-title">Rename skills</h2>
      <div class="field-row">
        <label class="field" for="rb-op">Pattern</label>
        <select class="txt" id="rb-op">
          <option value="add-prefix">Add prefix</option>
          <option value="strip-prefix">Strip prefix</option>
          <option value="replace">Find and replace</option>
        </select>
      </div>
      <div class="field-row" id="rb-row-a">
        <label class="field" for="rb-a" id="rb-label-a">Prefix</label>
        <input class="txt" id="rb-a" />
      </div>
      <div class="field-row" id="rb-row-b" hidden>
        <label class="field" for="rb-b">Replace with</label>
        <input class="txt" id="rb-b" />
      </div>
      <div class="dialog-actions">
        <button id="renamebulk-no" class="btn">Cancel</button>
        <button id="renamebulk-yes" class="btn primary">Preview</button>
      </div>
    </dialog>
    <div id="toast"></div>
    <script src="/ui.js"></script>
  </body>
</html>
